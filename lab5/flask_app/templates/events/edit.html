<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="form-container">
        <h1>Edit Event</h1>
        <form action="/edit_event" method="POST">
            <input type="hidden" name="event_id" value="{{ event.event_id }}">

            <label for="event_name">Event Name:</label>
            <input type="text" id="event_name" name="event_name" value="{{ event.event_name }}" required maxlength="30">

            <label for="subject_name">Subject Name:</label>
            <input type="text" id="subject_name" name="subject_name" value="{{ event.subject_name }}" required maxlength="20">

            <label for="stream_id">Stream:</label>
            <select id="stream_id" name="stream_id">
                {% for stream in streams %}
                <option value="{{ stream.stream_id }}" {% if stream.stream_id == event.stream_id %}selected{% endif %}>
                    {{ stream.stream_name }}
                </option>
                {% endfor %}
            </select>

            <label for="event_start_datetime">Event Start Date & Time:</label>
            <input type="datetime-local" id="event_start_datetime" name="event_start_datetime" value="{{ event.event_start_datetime|datetimeformat }}" required>

            <label for="event_audience">Event Audience:</label>
            <input type="text" id="event_audience" name="event_audience" value="{{ event.event_audience }}" required maxlength="20">

            <label for="event_duration">Event Duration (in minutes):</label>
            <input type="number" id="event_duration" name="event_duration" value="{{ event.event_duration }}" required min="1">

            <label for="event_type">Event Type:</label>
            <select id="event_type" name="event_type">
                {% for event_type in event_types %}
                <option value="{{ event_type.type_id }}" {% if event_type.type_id == event.event_type %}selected{% endif %}>
                    {{ event_type.type_name }}
                </option>
                {% endfor %}
            </select>

            <div class="navigation-buttons">
                <a href="/events" class="button-nav">Back</a>
                <button type="submit" class="button">Update Event</button>
            </div>
        </form>
    </div>
</body>
</html>
