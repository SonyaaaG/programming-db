<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Event Type</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="form-container">
        <h1>Add Event Type</h1>
        {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
        <div>
            {% for category, message in messages %}
            <div class="flash-message {{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form action="/add_eventtype" method="POST">
            <label for="type_name">Event Type Name:</label>
            <input type="text" id="type_name" name="type_name" placeholder="e.g., Conference, Webinar" required maxlength="20">

            <div class="navigation-buttons">
                <a href="/eventtypes" class="button-nav">Back</a>
                <button type="submit" class="button">Add Event Type</button>
            </div>
        </form>
    </div>
</body>
</html>
