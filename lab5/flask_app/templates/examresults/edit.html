<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Exam Result</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="form-container">
        <h1>Edit Exam Result</h1>
        <form action="/edit_examresult" method="POST">
            <input type="hidden" name="application_id" value="{{ examresult.application_id }}">
            <input type="hidden" name="event_id" value="{{ examresult.event_id }}">

            <label for="exam_mark">Exam Mark:</label>
            <input type="number" step="0.1" id="exam_mark" name="exam_mark" value="{{ examresult.exam_mark }}" required>

            <label for="appeal_status">Appeal Status:</label>
            <input type="checkbox" id="appeal_status" name="appeal_status" {% if examresult.appeal_status %}checked{% endif %}>

            <label for="appeal_mark">Appeal Mark:</label>
            <input type="number" step="0.1" id="appeal_mark" name="appeal_mark" value="{{ examresult.appeal_mark }}">

            <div class="navigation-buttons">
                <a href="/examresults" class="button-nav">Back</a>
                <button type="submit" class="button">Update Exam Result</button>
            </div>
        </form>
    </div>
</body>
</html>
