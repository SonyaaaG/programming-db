<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Exam Result</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="add-container">
        <h1>Add Exam Result</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div>
                    {% for category, message in messages %}
                        <div class="flash-message {{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="/add_examresult" method="POST" class="form">
            <label for="application_id">Application ID:</label>
            <input list="application_ids" id="application_id" name="application_id" required>
            <datalist id="application_ids">
                {% for app in applications %}
                <option value="{{ app.application_id }}">{{ app.applicant_id }}</option>
                {% endfor %}
            </datalist>

            <label for="event_id">Event ID:</label>
            <input list="event_ids" id="event_id" name="event_id" required>
            <datalist id="event_ids">
                {% for event in events %}
                <option value="{{ event.event_id }}">{{ event.event_name }}</option>
                {% endfor %}
            </datalist>

            <label for="exam_mark">Exam Mark:</label>
            <input type="number" step="0.1" id="exam_mark" name="exam_mark" placeholder="e.g., 90.5" required>

            <label for="appeal_status">Appeal Status:</label>
            <input type="checkbox" id="appeal_status" name="appeal_status">

            <label for="appeal_mark">Appeal Mark:</label>
            <input type="number" step="0.1" id="appeal_mark" name="appeal_mark" placeholder="e.g., 92.0">

            <div class="navigation-buttons">
                <a href="/examresults" class="button-nav">Back</a>
                <button type="submit" class="button">Add Exam Result</button>
            </div>
        </form>
    </div>
</body>
</html>
